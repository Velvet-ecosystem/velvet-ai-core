name: Library evidence acceptance

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    name: Library evidence Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - name: Check out Core
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check out tested Language
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Velvet-ecosystem/velvet-language
          ref: e3f4a65ee83aa30cd1f2081c24b251760b76f007
          path: .acceptance-deps/velvet-language
          persist-credentials: false

      - name: Check out tested Runtime
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: Velvet-ecosystem/velvet-runtime
          ref: 32117e7e6f58c2b5a8c01d952a4cbcd9f43877ec
          path: .acceptance-deps/velvet-runtime
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Record tested commits
        shell: bash
        run: |
          git rev-parse HEAD > tested-commits.txt
          git -C .acceptance-deps/velvet-language rev-parse HEAD >> tested-commits.txt
          git -C .acceptance-deps/velvet-runtime rev-parse HEAD >> tested-commits.txt
          cat tested-commits.txt

      - name: Install explicit test dependencies
        run: python -m pip install -e . -e .acceptance-deps/velvet-language 'pytest>=7.4,<8.4'

      - name: Run complete Core suite and real conversation acceptance
        env:
          PYTHONPATH: ${{ github.workspace }}/.acceptance-deps/velvet-runtime
        run: python -m pytest tests acceptance -q -ra --junitxml=library-evidence-results.xml

      - name: Preserve executed test counts and dependency commits
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: library-evidence-python-${{ matrix.python-version }}
          path: |
            library-evidence-results.xml
            tested-commits.txt
