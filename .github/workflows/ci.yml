name: AI Core CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # pinned v5 commit
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run baseline tests
        id: unittest
        continue-on-error: true
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > unittest-${{ matrix.python-version }}.log 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Generate promotion evidence
        if: always()
        run: python scripts/generate_promotion_evidence.py --repository velvet-ai-core --module native-brain-integration --suite unittest --status "${{ steps.unittest.outputs.status }}" --python "${{ matrix.python-version }}" --output "promotion-evidence-${{ matrix.python-version }}.json"

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-evidence-ai-core-${{ matrix.python-version }}
          path: promotion-evidence-${{ matrix.python-version }}.json

      - name: Upload unittest report
        if: steps.unittest.outputs.status != '0'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unittest-ai-core-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.log

      - name: Fail on unittest errors
        if: steps.unittest.outputs.status != '0'
        run: |
          cat unittest-${{ matrix.python-version }}.log
          exit 1
